<!-- index.html -->
<!DOCTYPE html>
<html lang="en">

    <head>
        <title>Home Page</title>
        <meta name="description" content="This is a home page for my website where users will come first.">
        <meta name="keywords" content="homepage, demo, fswad">
    </head>

    <body>
        <div class="container">
            <div class="row">
                <div class="column">
                    <h1 id="home_page_header" class="hp_heading_class">HTML Form</h1>
                    <hr>
                    <h4>Text, password, Submit</h4>
                    <!-- a form that accepts file because of enctype selected here -->
                    <form action="/path_to_my_server" method="POST" enctype="multipart/form-data">
                        <label for="username_id">Please provide your Username:</label>
                        <input type="text" name="user_name" id="username_id" maxlength="20" minlength="5">
                        <br><br>
                        <label for="pass_id">User password:</label>
                        <input type="password" name="user_pass" id="pass_id">
                        <br><br>
                        <input type="submit" value="Send!">
                    </form>
                </div>
            </div>
        </div>
    </body>

</html>

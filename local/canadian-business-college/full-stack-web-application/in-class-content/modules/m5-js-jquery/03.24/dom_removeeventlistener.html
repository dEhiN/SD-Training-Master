<!-- index.html -->
<!-- html with external jsvascript -->
<!DOCTYPE html>
<html lang="en">

    <head>
        <title>Home Page</title>
        <meta name="description" content="This is a home page for my website where users will come first.">
        <meta name="keywords" content="homepage, demo, fswad">

        <!-- meta tag so that the media in css can work -->
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link href="style.css" rel="stylesheet">
        <script src="dom_removeeventlistener.js" defer></script>
    </head>

    <body>
        <div class="container">
            <div class="row">
                <div class="column">
                    <h1 id="my_main_header">Javascript variables</h1>
                    <p class="my_para">hello</p>
                    <p class="my_para">world</p>



                    <input type="text" id="user_value" name="user_val" placeholder="User value">
                    <!-- <input type="number" id="user_value_second" name="user_val_2" placeholder="Another User value"> -->
                    <!-- button with onclick attribute to call the javascript function -->
                    <button id="sub_button">Submit</button>
                    <p id="result_para"></p>
                    <a id="my_google_anchor" href="https://google.com" target="_blank">Go to google!</a>
                    <img id="ph_img" src="media/images/phone.png" alt="phone image">




                    <form id="user_form" action="" method="POST">
                        <input type="text" placeholder="Insert Text">
                        <input type="number" placeholder="Insert Number">
                        <input type="submit" value="Send">
                    </form>
                </div>
            </div>
        </div>
        <!-- adding external js where js code is dependent on the HTML to load completely -->

    </body>

</html>
